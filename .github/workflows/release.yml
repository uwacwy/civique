name: Build Theme Release

on:
   push:
      tags:
         - "v*"
   workflow_dispatch:

permissions:
   contents: write

jobs:
   package:
      runs-on: ubuntu-latest
      steps:
         - name: Check out repository
           uses: actions/checkout@v4

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Build distributable zip
           run: |
              npm run build

              # List the contents of the dist directory for debugging purposes
              ls -la dist

              ls -la dist/civique

              unzip -l dist/civique-*.zip

         - name: Upload artifact
           uses: actions/upload-artifact@v4
           with:
              name: civique-bundle
              path: dist/civique-*.zip
